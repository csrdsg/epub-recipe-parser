name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/epub_recipe_parser/structured/runtime/package-lock.json
      - run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - run: npm ci --prefix src/epub_recipe_parser/structured/runtime
      - run: uv run --locked --extra dev --python ${{ matrix.python-version }} pytest -q
      - if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev ruff check src/
      - if: matrix.python-version == '3.12'
        run: |
          uv run --locked --extra dev pytest --cov=epub_recipe_parser --cov-report=term-missing > coverage.txt
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"

  distributions:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.10'
      - run: uv build --python 3.12
      - name: Verify the installed wheel
        shell: bash
        run: |
          wheel=$(realpath dist/*.whl)
          version=$(uv run --isolated --no-project --python 3.12 --with "$wheel" epub-parser --version)
          echo "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$version" == *"version ${GITHUB_REF_NAME#v}" ]]
          fi
          sample=$(realpath examples/sample-cookbook/sample.epub)
          cd "$(mktemp -d)"
          parser() {
            uv run --isolated --no-project --python 3.12 --with "$wheel" epub-parser "$@"
          }
          parser extract "$sample" -o recipes.db
          parser export recipes.db -f json -o recipes.json
          grep -q '"count": 2' recipes.json
          parser import-vault "$sample" vault
          note=vault/Small-Kitchen-Cookbook/Ginger-Tofu.md
          printf '\nPersonal edit.\n' >> "$note"
          parser import-vault "$sample" vault | grep -q 'Preserved 2 existing recipe notes'
          grep -q 'Personal edit.' "$note"
          test "$(find vault -name '*.md' | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
